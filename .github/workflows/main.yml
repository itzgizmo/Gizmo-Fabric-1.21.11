
name: Build Gizmo Fabric Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Gizmo
        working-directory: Gizmo-Fabric-1.21.11-Source-Download/Gizmo-Fabric-1.21.11
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: gizmo-1.0.0
          path: Gizmo-Fabric-1.21.11-Source-Download/Gizmo-Fabric-1.21.11/build/libs/*.jar
